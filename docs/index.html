<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Job Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">⚡ <span>Job Scanner</span></div>
  <div class="hdr-meta">
    <span id="scan-info">loading…</span>
  </div>
  <div class="hdr-actions">
    <button id="btn-notify" title="Browser notifications">🔔</button>
    <button id="btn-refresh" title="Refresh now">↻</button>
    <button id="btn-filters" class="mobile-only" title="Filters">☰</button>
  </div>
</header>

<div id="filters" class="filters">
  <div class="frow">
    <label>Max age
      <select id="f-age">
        <option value="0.5">30 min</option>
        <option value="1">1 hour</option>
        <option value="2">2 hours</option>
        <option value="4" selected>4 hours</option>
        <option value="8">8 hours</option>
        <option value="24">24 hours</option>
      </select>
    </label>
    <label>Sort
      <select id="f-sort">
        <option value="best" selected>Best (score + newest)</option>
        <option value="newest">Newest first</option>
        <option value="score">Highest score</option>
        <option value="weekend">Weekend priority</option>
        <option value="afterhours">After-hours priority</option>
        <option value="salary">Highest salary</option>
      </select>
    </label>
    <label>Min score <input id="f-score" type="number" min="0" max="100" value="0" inputmode="numeric"></label>
    <label>Status
      <select id="f-status">
        <option value="active" selected>Active (new + viewed)</option>
        <option value="new">New only</option>
        <option value="applied">Applied</option>
        <option value="favorite">Favorites</option>
        <option value="ignored">Ignored</option>
        <option value="all">Everything</option>
      </select>
    </label>
    <label>Category
      <select id="f-cat">
        <option value="">All categories</option>
        <option value="azure">Azure</option>
        <option value="cloud">Cloud</option>
        <option value="data">Data / SQL</option>
        <option value="security">Security</option>
        <option value="support">Support / TAM</option>
      </select>
    </label>
    <label>Source <select id="f-source"><option value="">All sources</option></select></label>
  </div>
  <div class="frow">
    <input id="f-q" type="search" placeholder="Search title / description…">
    <input id="f-company" type="search" placeholder="Company…">
    <label class="chk"><input id="f-remote" type="checkbox" checked> Remote only</label>
    <label class="chk hi-wk"><input id="f-weekend" type="checkbox"> Weekend</label>
    <label class="chk hi-ah"><input id="f-afterhours" type="checkbox"> After-hours</label>
    <label class="chk"><input id="f-swing" type="checkbox"> Swing</label>
    <label class="chk"><input id="f-night" type="checkbox"> Night</label>
  </div>
</div>

<main>
  <section id="sec-hot" class="prio" hidden>
    <h2>🔥 HOT JOBS <small>posted &lt;1h, strong match</small></h2>
    <div class="cards"></div>
  </section>
  <section id="sec-weekend" class="prio wk" hidden>
    <h2>📅 WEEKEND JOBS</h2>
    <div class="cards"></div>
  </section>
  <section id="sec-afterhours" class="prio ah" hidden>
    <h2>🌙 AFTER-HOURS JOBS</h2>
    <div class="cards"></div>
  </section>
  <section id="sec-newest" class="prio" hidden>
    <h2>🆕 NEWEST JOBS</h2>
    <div class="cards"></div>
  </section>
  <section id="sec-all">
    <h2>ALL MATCHES <small id="all-count"></small></h2>
    <div class="cards" id="all-cards"></div>
    <p id="empty" hidden>No jobs match the current filters. Widen the max age or lower the min score — or the sources are just quiet right now.</p>
  </section>
</main>

<footer>
  <span id="src-health"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
